# Gateway: único punto de entrada, maneja el CORS y traduce la ruta pública a la del backend
server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ORIGINS:http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            maxAge: 3600
      routes:
        - id: tienda-api
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/delicias/v1/**
          filters:
            - RewritePath=/delicias/v1/?(?<segment>.*), /api/v1/$\{segment}