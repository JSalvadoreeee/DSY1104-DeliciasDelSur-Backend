# Gateway: único punto de entrada, maneja el CORS y reenvía al backend
server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ORIGINS:http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            maxAge: 3600
      routes:
        - id: api-v1
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/**
        - id: documentacion
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**