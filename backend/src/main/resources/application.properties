server.port=8081

# Conexión MySQL (Laragon por defecto / Variables de entorno para AWS)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/delicias_del_sur?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# Configuración JWT
jwt.secret=${JWT_SECRET:DeliciasDelSurClaveSecretaSuperSeguraParaFirmarTokensJWT2026DSY1104}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html